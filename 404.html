<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // 1. Current URL ka path nikaalein (e.g., /Welspun/carpet-tiles/Meander.html)
        let currentPath = window.location.pathname;
        let originalPath = currentPath;

        // 2. Path ko lowercase (small letters) me convert karein
        currentPath = currentPath.toLowerCase();

        // 3. Agar link ke end me '.html' hai, toh use remove karein (Clean URL fix)
        if (currentPath.endsWith('.html')) {
            currentPath = currentPath.slice(0, -5);
        }

        // 4. Agar URL me trailing index.html ya /index ban raha hai toh handle karein
        if (currentPath.endsWith('/index')) {
            currentPath = currentPath.slice(0, -6) + '/';
        }

        // 5. Agar path change hua hai, toh automatically naye URL par bhej dein
        if (currentPath !== originalPath) {
            let searchParams = window.location.search; // Query parameters (?sku=...) ko preserve rakhne ke liye
            window.location.replace(window.location.origin + currentPath + searchParams);
        } else {
            // Agar sach me koi galat URL hai jo website par exist hi nahi karta, toh use Home Page par bhej dein
            window.location.replace("/");
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #121212;
        }
        .loader-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F3F4F6;
            border-top: 4px solid #C5A059;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 10px 0; font-size: 18px;">Loading Correct Page...</h2>
        <p style="margin: 0; font-size: 14px; color: #6B7280;">Please wait while we redirect you.</p>
    </div>
    <script src="form-handler.js"></script>
</body>
</html>
