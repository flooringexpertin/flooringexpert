<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        // 1. Current URL ka path nikaalein (e.g., /Welspun/carpet-tiles/Meander.html)
        let currentPath = window.location.pathname;
        let originalPath = currentPath;

        // 2. Path ko lowercase (small letters) me convert karein
        currentPath = currentPath.toLowerCase();

        // 3. Agar link ke end me '.html' hai, toh use remove karein (Clean URL fix)
        if (currentPath.endsWith('.html')) {
            currentPath = currentPath.slice(0, -5);
        }

        // 4. Agar URL me trailing index.html ya /index ban raha hai toh handle karein
        if (currentPath.endsWith('/index')) {
            currentPath = currentPath.slice(0, -6) + '/';
        }

        // 5. Agar path change hua hai, toh automatically naye URL par bhej dein
        if (currentPath !== originalPath) {
            let searchParams = window.location.search; // Query parameters (?sku=...) ko preserve rakhne ke liye
            window.location.replace(window.location.origin + currentPath + searchParams);
        } else {
            // Agar sach me koi galat URL hai jo website par exist hi nahi karta, toh use Home Page par bhej dein
            window.location.replace("/");
        }
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #121212;
        }
        .loader-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F3F4F6;
            border-top: 4px solid #C5A059;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 10px 0; font-size: 18px;">Loading Correct Page...</h2>
        <p style="margin: 0; font-size: 14px; color: #6B7280;">Please wait while we redirect you.</p>
    </div>
<!-- Form Inline Handler Start -->
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_JA84a_GnEr5JwRac1H4FaMqb3Qm8Dcc4DsbDk5VC2dkAuZP3KeIrKt_Z7iS3arDF/exec"; 

document.addEventListener("DOMContentLoaded", function() {
  const enquiryForm = document.getElementById("enquiryForm");
  const submitBtn = document.getElementById("submitBtn");

  if (enquiryForm) {
    enquiryForm.addEventListener("submit", function(e) {
      e.preventDefault();

      if (submitBtn) {
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;
      }

      // Meta Pixel Lead event
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }

      const formData = new FormData(enquiryForm);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => {
        redirectToThankYou();
      })
      .catch(error => {
        console.error("Error submitting form:", error);
        redirectToThankYou();
      });
    });
  }
});

function redirectToThankYou() {
  setTimeout(() => {
    const hostname = window.location.hostname;
    
    // 1. Agar Custom Domain (flooringexpert.in) par hai
    if (hostname.includes("flooringexpert.in")) {
      window.location.href = "/thank-you.html";
    } 
    // 2. Agar GitHub Pages (username.github.io/flooringexpert) par hai
    else if (hostname.includes("github.io")) {
      window.location.href = "/flooringexpert/thank-you.html";
    } 
    // 3. Local Machine ya normal relative structure ke liye
    else {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // Agar kisi subfolder ke andar hain toh ../ lagakar root par bhejega
      const depth = pathSegments.length > 1 ? pathSegments.length - 1 : 0;
      const prefix = depth > 0 ? "../".repeat(depth) : "./";
      window.location.href = prefix + "thank-you.html";
    }
  }, 200);
}
</script>
<!-- Form Inline Handler End -->
</body>
</html>
