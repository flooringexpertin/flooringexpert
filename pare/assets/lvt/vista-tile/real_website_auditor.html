<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitDelivr - Real Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-8">

    <main class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Real Time Site Auditor</h1>
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border mb-8">
            <input type="text" id="siteUrl" class="w-full p-4 border rounded-xl mb-4" placeholder="Enter URL (https://google.com)">
            <button onclick="analyzeSite()" id="auditBtn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">Analyze Now</button>
        </div>

        <div id="loader" class="hidden text-center py-10 font-bold">Checking website data... please wait...</div>

        <div id="results" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="p-6 bg-white rounded-2xl border shadow-sm">
                    <h4 class="text-sm font-bold text-slate-400">Performance Score</h4>
                    <p id="perfScore" class="text-4xl font-black mt-2">--</p>
                </div>
                <div class="p-6 bg-white rounded-2xl border shadow-sm">
                    <h4 class="text-sm font-bold text-slate-400">Accessibility</h4>
                    <p id="a11yScore" class="text-4xl font-black mt-2">--</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function analyzeSite() {
            const url = document.getElementById('siteUrl').value;
            if(!url) return alert("URL daalo bhai!");

            document.getElementById('auditBtn').disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                // Google PageSpeed Insights API use kar rahe hain
                const apiUrl = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.lighthouseResult) {
                    const scores = data.lighthouseResult.categories;
                    document.getElementById('perfScore').textContent = Math.round(scores.performance.score * 100) + "%";
                    document.getElementById('a11yScore').textContent = Math.round(scores.accessibility.score * 100) + "%";
                    
                    document.getElementById('results').classList.remove('hidden');
                } else {
                    alert("Audit fail ho gaya, shayad URL galat hai!");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('auditBtn').disabled = false;
            }
        }
    </script>
<!-- Form Inline Handler Start -->
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_JA84a_GnEr5JwRac1H4FaMqb3Qm8Dcc4DsbDk5VC2dkAuZP3KeIrKt_Z7iS3arDF/exec"; 

document.addEventListener("DOMContentLoaded", function() {
  const enquiryForm = document.getElementById("enquiryForm");
  const submitBtn = document.getElementById("submitBtn");

  if (enquiryForm) {
    enquiryForm.addEventListener("submit", function(e) {
      e.preventDefault();

      if (submitBtn) {
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;
      }

      // Meta Pixel Lead event
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }

      const formData = new FormData(enquiryForm);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => {
        redirectToThankYou();
      })
      .catch(error => {
        console.error("Error submitting form:", error);
        redirectToThankYou();
      });
    });
  }
});

function redirectToThankYou() {
  setTimeout(() => {
    const hostname = window.location.hostname;
    
    // 1. Agar Custom Domain (flooringexpert.in) par hai
    if (hostname.includes("flooringexpert.in")) {
      window.location.href = "/thank-you.html";
    } 
    // 2. Agar GitHub Pages (username.github.io/flooringexpert) par hai
    else if (hostname.includes("github.io")) {
      window.location.href = "/flooringexpert/thank-you.html";
    } 
    // 3. Local Machine ya normal relative structure ke liye
    else {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // Agar kisi subfolder ke andar hain toh ../ lagakar root par bhejega
      const depth = pathSegments.length > 1 ? pathSegments.length - 1 : 0;
      const prefix = depth > 0 ? "../".repeat(depth) : "./";
      window.location.href = prefix + "thank-you.html";
    }
  }, 200);
}
</script>
<!-- Form Inline Handler End -->
</body>
</html>
