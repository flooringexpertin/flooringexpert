<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitDelivr - Real Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4 sm:p-8">

    <main class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Real Time Site Auditor</h1>
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border mb-8">
            <input type="text" id="siteUrl" class="w-full p-4 border rounded-xl mb-4" placeholder="Enter URL (https://google.com)">
            <button onclick="analyzeSite()" id="auditBtn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold">Analyze Now</button>
        </div>

        <div id="loader" class="hidden text-center py-10 font-bold">Checking website data... please wait...</div>

        <div id="results" class="hidden space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="p-6 bg-white rounded-2xl border shadow-sm">
                    <h4 class="text-sm font-bold text-slate-400">Performance Score</h4>
                    <p id="perfScore" class="text-4xl font-black mt-2">--</p>
                </div>
                <div class="p-6 bg-white rounded-2xl border shadow-sm">
                    <h4 class="text-sm font-bold text-slate-400">Accessibility</h4>
                    <p id="a11yScore" class="text-4xl font-black mt-2">--</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function analyzeSite() {
            const url = document.getElementById('siteUrl').value;
            if(!url) return alert("URL daalo bhai!");

            document.getElementById('auditBtn').disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                // Google PageSpeed Insights API use kar rahe hain
                const apiUrl = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.lighthouseResult) {
                    const scores = data.lighthouseResult.categories;
                    document.getElementById('perfScore').textContent = Math.round(scores.performance.score * 100) + "%";
                    document.getElementById('a11yScore').textContent = Math.round(scores.accessibility.score * 100) + "%";
                    
                    document.getElementById('results').classList.remove('hidden');
                } else {
                    alert("Audit fail ho gaya, shayad URL galat hai!");
                }
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('auditBtn').disabled = false;
            }
        }
    </script>
    <script src="form-handler.js"></script>
</body>
</html>
