<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline | Flooring Expert</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        .logo {
            width: 50px;
            height: 50px;
            background: #121212;
            color: #C5A059;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            margin: 0 auto 20px;
            border: 1px solid #C5A059;
        }
        .icon {
            font-size: 48px;
            color: #C5A059;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #a0a0a0;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .btn {
            background-color: #C5A059;
            color: #121212;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #b38f4b;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">FE</div>
        <div class="icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M7.34 14.84a6.74 6.74 0 0 1 2.59-1.47M12 20h.01M14.07 17.93a2.83 2.83 0 0 0-4.14 0"/>
            </svg>
        </div>
        <h1>No Internet Connection</h1>
        <p>Your device is offline. Please check your network connection or Wi-Fi and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
<!-- Form Inline Handler Start -->
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_JA84a_GnEr5JwRac1H4FaMqb3Qm8Dcc4DsbDk5VC2dkAuZP3KeIrKt_Z7iS3arDF/exec"; 

document.addEventListener("DOMContentLoaded", function() {
  const enquiryForm = document.getElementById("enquiryForm");
  const submitBtn = document.getElementById("submitBtn");

  if (enquiryForm) {
    enquiryForm.addEventListener("submit", function(e) {
      e.preventDefault();

      if (submitBtn) {
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;
      }

      // Meta Pixel Lead event
      if (typeof fbq === 'function') {
        fbq('track', 'Lead');
      }

      const formData = new FormData(enquiryForm);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => {
        redirectToThankYou();
      })
      .catch(error => {
        console.error("Error submitting form:", error);
        redirectToThankYou();
      });
    });
  }
});

function redirectToThankYou() {
  setTimeout(() => {
    const hostname = window.location.hostname;
    
    // 1. Agar Custom Domain (flooringexpert.in) par hai
    if (hostname.includes("flooringexpert.in")) {
      window.location.href = "/thank-you.html";
    } 
    // 2. Agar GitHub Pages (username.github.io/flooringexpert) par hai
    else if (hostname.includes("github.io")) {
      window.location.href = "/flooringexpert/thank-you.html";
    } 
    // 3. Local Machine ya normal relative structure ke liye
    else {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      // Agar kisi subfolder ke andar hain toh ../ lagakar root par bhejega
      const depth = pathSegments.length > 1 ? pathSegments.length - 1 : 0;
      const prefix = depth > 0 ? "../".repeat(depth) : "./";
      window.location.href = prefix + "thank-you.html";
    }
  }, 200);
}
</script>
<!-- Form Inline Handler End -->
</body>
</html>
