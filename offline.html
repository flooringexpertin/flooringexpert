<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are Offline | Flooring Expert</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        .logo {
            width: 50px;
            height: 50px;
            background: #121212;
            color: #C5A059;
            font-weight: bold;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            margin: 0 auto 20px;
            border: 1px solid #C5A059;
        }
        .icon {
            font-size: 48px;
            color: #C5A059;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #a0a0a0;
            line-height: 1.6;
            margin: 0 0 25px 0;
        }
        .btn {
            background-color: #C5A059;
            color: #121212;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #b38f4b;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">FE</div>
        <div class="icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.5M5 12.5a10.94 10.94 0 0 1 5.83-2.84M7.34 14.84a6.74 6.74 0 0 1 2.59-1.47M12 20h.01M14.07 17.93a2.83 2.83 0 0 0-4.14 0"/>
            </svg>
        </div>
        <h1>No Internet Connection</h1>
        <p>Your device is offline. Please check your network connection or Wi-Fi and try again.</p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>

    <script src="form-handler.js"></script>
</body>
</html>
