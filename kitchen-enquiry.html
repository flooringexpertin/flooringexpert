  <title>Get Instant Modular Kitchen Quote | Kitchen Expert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #eef2f6; color: #2b3649; }
    .navbar { background: #ffffff; border-bottom: 1px solid #dcdfe6; padding: 12px 4%; display: flex; align-items: center; justify-content: space-between; }
    .brand-container { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-box { background: #121212; color: #c5a059; font-weight: 800; padding: 6px 10px; border-radius: 4px; font-size: 16px; }
    .brand-title h2 { font-size: 17px; color: #1a2536; font-weight: 700; line-height: 1.1; }
    .brand-title span { font-size: 10px; color: #6c7a89; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
    .explore-link { font-size: 13.5px; font-weight: 600; color: #3e4c5e; text-decoration: none; }
    .explore-link:hover { color: #c5a059; }
    .wrapper { max-width: 820px; margin: 45px auto; padding: 0 20px; }
    .page-header { text-align: center; margin-bottom: 28px; }
    .page-header h1 { font-size: 30px; color: #c5a059; font-weight: 700; margin-bottom: 8px; }
    .page-header p { color: #637381; font-size: 15px; }
    .form-card { background: #ffffff; border-radius: 8px; padding: 35px 40px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04); border: 1px solid #e1e6eb; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: span 2; }
    label { font-size: 13.5px; font-weight: 600; color: #37474f; margin-bottom: 7px; }
    input, select, textarea { width: 100%; padding: 11px 14px; border: 1px solid #d0d7de; border-radius: 5px; font-size: 14px; color: #2b3649; background-color: #f8fafc; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #c5a059; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.18); }
    textarea { resize: vertical; min-height: 110px; }
    .submit-btn { width: 100%; background-color: #c5a059; color: #ffffff; padding: 14px; border: none; border-radius: 5px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 25px; }
    .submit-btn:hover { background-color: #b28e47; }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .form-group.full-width { grid-column: span 1; } .form-card { padding: 25px 20px; } }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="/kitchen/index.html" class="brand-container">
      <div class="logo-box">KE</div>
      <div class="brand-title">
        <h2>Kitchen Expert</h2>
        <span>Kitchen Solutions</span>
      </div>
    </a>
    <a href="/index.html" class="explore-link">
      <i class="fa-solid fa-arrow-left mr-1"></i> Explore Main Website
    </a>
  </header>

  <div class="wrapper">
    <div class="page-header">
      <h1>Get Instant Modular Kitchen Quote</h1>
      <p>Share your requirements to get exclusive and factory pricing. Express installation available.</p>
    </div>

    <div class="form-card">
      <form id="enquiryForm">
        <!-- Hidden Tag for Kitchen Ads -->
        <input type="hidden" name="leadSource" value="Kitchen-Ads">

        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Amit Sharma" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+91 99999 99999" required>
          </div>

          <div class="form-group">
            <label for="city">City / Location</label>
            <input type="text" id="city" name="city" placeholder="e.g. Hyderabad, Delhi NCR" required>
          </div>

          <div class="form-group">
            <label for="product">Kitchen Layout</label>
            <select id="product" name="product" required>
              <option value="L-Shaped Kitchen">L-Shaped Kitchen</option>
              <option value="Parallel Kitchen">Parallel / Galley Kitchen</option>
              <option value="Island Kitchen">Island Kitchen</option>
              <option value="U-Shaped Kitchen">U-Shaped Kitchen</option>
              <option value="Straight Line Kitchen">Straight Line Kitchen</option>
              <option value="Complete Renovation">Complete Kitchen Renovation</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="details">Project Details / Dimensions</label>
            <textarea id="details" name="details" placeholder="Tell us your approximate dimensions (e.g. 10x12 ft), preferred finish (Acrylic/PU)..."></textarea>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Kitchen Consultation Request</button>
      </form>
    </div>
  </div>

  <script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4jfjZMR4E2oNUhfHwpJoa1HdM482qTAhmLypsadyafQHIDbiIRUdrSLCcIMl5XnCY/exec"; 

  document.addEventListener("DOMContentLoaded", function() {
    const enquiryForm = document.getElementById("enquiryForm");
    const submitBtn = document.getElementById("submitBtn");

    if (enquiryForm) {
      enquiryForm.addEventListener("submit", function(e) {
        e.preventDefault();
        if (submitBtn) {
          submitBtn.innerText = "Submitting...";
          submitBtn.disabled = true;
        }
        if (typeof fbq === 'function') { fbq('track', 'Lead'); }

        const formData = new FormData(enquiryForm);
        fetch(SCRIPT_URL, { method: "POST", body: formData })
        .then(() => redirectToThankYou())
        .catch(() => redirectToThankYou());
      });
    }
  });

  function redirectToThankYou() {
    setTimeout(() => {
      const hostname = window.location.hostname;
      if (hostname.includes("flooringexpert.in")) { window.location.href = "/thank-you.html"; }
      else if (hostname.includes("github.io")) { window.location.href = "/flooringexpert/thank-you.html"; }
      else { window.location.href = "./thank-you.html"; }
    }, 200);
  }
  </script>


<!-- Form Inline Handler End -->

</body>
</html>
